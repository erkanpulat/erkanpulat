<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="1000" height="20" fill="none" role="img" aria-label="">
  <defs>
	<linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
	  <stop offset="0%" stop-color="#9fb4dc" stop-opacity="0"/>
	  <stop offset="25%" stop-color="#9fb4dc" stop-opacity="0.4"/>
	  <stop offset="50%" stop-color="#c6d6f8" stop-opacity="0.55"/>
	  <stop offset="75%" stop-color="#9fb4dc" stop-opacity="0.4"/>
	  <stop offset="100%" stop-color="#9fb4dc" stop-opacity="0"/>
	</linearGradient>
	<linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
	  <stop offset="0%" stop-color="#e8edf6" stop-opacity="0"/>
	  <stop offset="100%" stop-color="#e8edf6" stop-opacity="0.9"/>
	</linearGradient>
	<filter id="b" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>
  <style>
	.comet{animation:fly 7s cubic-bezier(.4,0,.6,1) infinite}
	@keyframes fly{0%{transform:translateX(-150px);opacity:0}7%{opacity:1}90%{opacity:1}100%{transform:translateX(1050px);opacity:0}}
	.gl{animation:gl 4s ease-in-out infinite}
	@keyframes gl{0%,100%{opacity:.4}50%{opacity:.85}}
  </style>
  <rect x="0" y="9.4" width="1000" height="1.2" fill="url(#l)" class="gl"/>
  <g class="comet">
	<rect x="-110" y="8.9" width="110" height="2.2" fill="url(#t)" filter="url(#b)" opacity="0.65"/>
	<rect x="-110" y="9.6" width="110" height="1" fill="url(#t)"/>
	<circle cx="2" cy="10.1" r="3.2" fill="#c6d6f8" filter="url(#b)"/>
	<circle cx="2" cy="10.1" r="1.7" fill="#e8edf6"/>
  </g>
</svg>
